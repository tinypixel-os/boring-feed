<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Known Facts Feed – Options</title>
  <style>
    body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #111; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-top: 28px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    .hint { color: #666; font-weight: 400; font-size: 13px; }
    input[type=text], textarea { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    textarea { min-height: 110px; }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-weight: 400; }
    button { margin-top: 20px; padding: 8px 18px; font: inherit; cursor: pointer; }
    #status { margin-left: 12px; color: #2a7; }
  </style>
</head>
<body>
  <h1>Known Facts Feed</h1>
  <p>Fill in what you know about yourself. Leave a field empty to skip it. Facts become the posts in your replacement feed.</p>

  <form id="form">
    <div id="fields"></div>

    <label for="custom">Custom facts <span class="hint">(one full sentence per line)</span></label>
    <textarea id="custom" placeholder="You fear trying something new&#10;You keep saying you'll start tomorrow"></textarea>

    <h2>Behaviour</h2>
    <label class="row"><input type="checkbox" id="enabled"> Enabled</label>
    <label class="row"><input type="checkbox" id="shuffle"> Shuffle order <span class="hint">(off = same predictable order every time)</span></label>

    <h2>Sites</h2>
    <div id="sites"></div>

    <button type="submit">Save</button><span id="status"></span>
  </form>

  <script src="sites.js"></script>
  <script src="options.js"></script>
</body>
</html>
