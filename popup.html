<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 12px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }
    label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    a { display: inline-block; margin-top: 8px; cursor: pointer; color: #06c; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="enabled"> Enabled everywhere</label>
  <label id="siteRow" hidden><input type="checkbox" id="site"> <span id="siteName"></span></label>
  <a id="opts">Edit my facts</a>
  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
