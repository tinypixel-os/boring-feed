<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --fg: #15181c;
      --muted: #5f6a75;
      --line: #e1e4e8;
      --track: #c9ced4;
      --accent: #2f6fde;
      --accent-hover: #2459b8;
      --accent-fg: #fff;
      --focus: rgba(47, 111, 222, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #171a20;
        --fg: #e8eaed;
        --muted: #9aa4af;
        --line: #2a2f37;
        --track: #3a414b;
        --accent: #5b8ff0;
        --accent-hover: #7aa5f4;
        --accent-fg: #0b1220;
        --focus: rgba(91, 143, 240, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [hidden] { display: none !important; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    header img { width: 28px; height: 28px; }
    header b { font-size: 15px; }
    main { padding: 6px 16px 16px; }

    /* Checkbox drawn as a switch */
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; cursor: pointer; }
    .switch + .switch { border-top: 1px solid var(--line); }
    .switch.sub { padding-left: 14px; color: var(--muted); font-size: 13px; }
    .switch:has(input:disabled) { opacity: 0.5; cursor: default; }
    .switch input {
      appearance: none;
      flex: none;
      position: relative;
      width: 36px;
      height: 20px;
      margin: 0;
      border-radius: 999px;
      background: var(--track);
      cursor: inherit;
      transition: background 0.15s;
    }
    .switch input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    .switch input:checked { background: var(--accent); }
    .switch input:checked::after { transform: translateX(16px); }
    .switch input:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }

    #opts {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #opts:hover { background: var(--accent-hover); }
    #opts:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <b>Boring Feed</b>
  </header>
  <main>
    <label class="switch">Enabled everywhere <input type="checkbox" id="enabled"></label>
    <label class="switch" id="siteRow" hidden><span id="siteName"></span> <input type="checkbox" id="site"></label>
    <label class="switch sub" id="profileRow" hidden>Replace other people's profiles <input type="checkbox" id="profile"></label>
    <button type="button" id="opts">Edit my facts</button>
  </main>
  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
